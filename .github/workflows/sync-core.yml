name: Sync Core

# The bundled Core is a copy. A fix published to @jsray/core does not arrive
# here on its own, and until this workflow existed nothing noticed when it
# hadn't: Core 0.0.1-beta.3 fixed a denial of service that stayed in this
# bundle until a person happened to check.
#
# Polling rather than a release trigger from Core. A trigger would be faster,
# but it needs a long-lived cross-repo token stored in Core — one credential
# that can write to all three integrations — to save a wait already measured in
# hours. For a project whose pitch is verifying that the Core you run is the
# official one, that trade is the wrong way round. This needs no secret beyond
# the token GitHub issues per run.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  # Read-only, to see whether a sync branch has a pull request open before the
  # retirement step below deletes it. Declaring permissions at all sets every
  # unlisted scope to none.
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compare the bundled snapshot with the registry
        id: check
        run: |
          bundled=$(node -p "require('./version.json').bundledCore.version")
          published=$(npm view @jsray/core dist-tags.beta 2>/dev/null || true)
          echo "bundled=$bundled"     >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          if [ -n "$published" ] && [ "$published" != "$bundled" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "bundled $bundled, published $published"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "up to date on $bundled"
          fi

      - name: Sync, test, push the branch, and file an issue
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.published }}
          FROM: ${{ steps.check.outputs.bundled }}
        run: |
          set -e
          branch="core/$VERSION"

          # Idempotent. This runs every six hours; it must not reopen a pull
          # request that is already waiting for review.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "$branch already exists — nothing to do"
            exit 0
          fi

          git config user.name  'Jie'
          git config user.email 'jie@jsray.org'
          git checkout -b "$branch"

          JSRAY_CORE_VERSION="$VERSION" sh tools/sync-core.sh
          npm test
          npm run check:core

          if [ -z "$(git status --porcelain)" ]; then
            echo "sync produced no changes — the snapshot was already current"
            exit 0
          fi

          git add -A
          git commit -m "Bundle JSRay Core $VERSION

          Replaces the vendored snapshot of $FROM. Nothing in this repository
          changed; the engine did. Opened automatically, because a copied
          dependency does not update itself and the last one left behind
          carried a denial of service for two releases."

          # The branch is pushed here; the pull request is opened by a person.
          #
          # `gh pr create` needs "Allow GitHub Actions to create and approve pull
          # requests", and that switch is organisation-wide: turning it on lets
          # every workflow in every repository open pull requests, to save one
          # click here. The other way round it is a stored PAT — the cross-repo
          # credential the polling design at the top of this file exists to
          # avoid. Neither is worth a click.
          #
          # So this files an issue, which needs no such permission, and puts the
          # compare link in it. Everything automation is actually worth has
          # already happened by this line: the staleness was noticed, the sync
          # ran, and the suite proved it did not break anything.
          #
          # A human-opened pull request also gets its checks run, which one
          # opened with GITHUB_TOKEN does not — GitHub blocks that to prevent
          # recursion. The old path produced a pull request with no checks on it.
          git push -u origin "$branch"

          gh issue create \
            --title "Bundle JSRay Core $VERSION" \
            --body "The bundled Core snapshot is \`$FROM\`; the published beta is \`$VERSION\`.

          Branch \`$branch\` is pushed and ready. **[Open the pull request]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1)**

          \`tools/sync-core.sh\` replaced the vendored files from the published tarball, the suite passed, and the freshness check now agrees with the registry — all of that ran before the branch was pushed.

          **Merging this does not ship the fix.** This CLI still has to be released to npm — start that as soon as this lands if the Core release fixed a vulnerability.

          [Core changelog](https://github.com/jsrayorg/jsray/blob/main/CHANGELOG.md)"

      # Every Core release used to leave one more issue and one more `core/*`
      # branch behind, because nothing retired the previous ones: two releases
      # in, this repository carried an issue and a branch per version, and only
      # the newest meant anything. So every run retires whatever the current
      # state has made obsolete — everything but the published version while
      # the bundle is stale, and everything once it is current. The second case
      # is how the issues close when a release bundles Core, rather than only
      # when this workflow happens to sync it first.
      #
      # Two things are never touched. If the registry did not answer, nothing
      # is known about what is obsolete, so nothing is retired. And a branch
      # with a pull request open from it stays: closing somebody's review is
      # not this workflow's decision.
      - name: Retire superseded sync issues and branches
        env:
          GH_TOKEN: ${{ github.token }}
          STALE: ${{ steps.check.outputs.stale }}
          PUBLISHED: ${{ steps.check.outputs.published }}
          BUNDLED: ${{ steps.check.outputs.bundled }}
        run: |
          set -e
          if [ -z "$PUBLISHED" ]; then
            echo "registry did not answer — retiring nothing"
            exit 0
          fi
          keep=""
          if [ "$STALE" = "true" ]; then keep="$PUBLISHED"; fi

          gh issue list --state open --search 'in:title "Bundle JSRay Core"' \
            --json number,title --jq '.[] | "\(.number)\t\(.title)"' |
          while IFS="$(printf '\t')" read -r number title; do
            version="${title#Bundle JSRay Core }"
            if [ "$version" = "$title" ]; then continue; fi
            if [ -n "$keep" ] && [ "$version" = "$keep" ]; then continue; fi
            if [ -n "$keep" ]; then
              note="Superseded: the published beta is now \`$keep\`."
            else
              note="Resolved: the bundled Core is \`$BUNDLED\`, the published beta."
            fi
            gh issue close "$number" --comment "$note"
          done

          git ls-remote --heads origin 'refs/heads/core/*' | awk '{print $2}' |
          sed 's#^refs/heads/##' |
          while read -r branch; do
            version="${branch#core/}"
            if [ -n "$keep" ] && [ "$version" = "$keep" ]; then continue; fi
            open=$(gh pr list --head "$branch" --state open --json number --jq length)
            if [ "$open" = "0" ]; then
              git push origin --delete "$branch"
            else
              echo "$branch has an open pull request — left in place"
            fi
          done
